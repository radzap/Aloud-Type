<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c5878"/></marker>
  </defs>
  <!-- 1. Dictation key -->
  <rect x="10" y="10" width="380" height="280" rx="20" fill="#ffffff" stroke="#e2dfef" stroke-width="2"/>
  <text x="40" y="56" font-size="15" font-weight="700" fill="#fc5e53" letter-spacing="2">STEP 1</text>
  <text x="40" y="88" font-size="26" font-weight="600" fill="#20027f">Press the Dictation key</text>
  <rect x="120" y="128" width="160" height="96" rx="14" fill="#f8f7fc" stroke="#20027f" stroke-width="2.5"/>
  <rect x="120" y="212" width="160" height="12" rx="6" fill="#e2dfef"/>
  <text x="200" y="182" font-size="26" font-weight="600" fill="#20027f" text-anchor="middle">Right Ctrl</text>
  <text x="200" y="262" font-size="17" fill="#5c5878" text-anchor="middle">Hold to talk  ·  Tap for hands-free</text>
  <line x1="398" y1="150" x2="442" y2="150" stroke="#5c5878" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2. Speak -->
  <rect x="450" y="10" width="380" height="280" rx="20" fill="#ffffff" stroke="#e2dfef" stroke-width="2"/>
  <text x="480" y="56" font-size="15" font-weight="700" fill="#fc5e53" letter-spacing="2">STEP 2</text>
  <text x="480" y="88" font-size="26" font-weight="600" fill="#20027f">Speak naturally</text>
  <rect x="510" y="140" width="260" height="64" rx="32" fill="#20027f"/>
  <g fill="#fc5e53">
    <rect x="540" y="164" width="8" height="16" rx="4"/><rect x="556" y="156" width="8" height="32" rx="4"/>
    <rect x="572" y="150" width="8" height="44" rx="4"/><rect x="588" y="160" width="8" height="24" rx="4"/>
    <rect x="604" y="152" width="8" height="40" rx="4"/><rect x="620" y="148" width="8" height="48" rx="4"/>
    <rect x="636" y="158" width="8" height="28" rx="4"/><rect x="652" y="154" width="8" height="36" rx="4"/>
    <rect x="668" y="162" width="8" height="20" rx="4"/><rect x="684" y="150" width="8" height="44" rx="4"/>
    <rect x="700" y="158" width="8" height="28" rx="4"/><rect x="716" y="164" width="8" height="16" rx="4"/>
    <rect x="732" y="167" width="8" height="10" rx="4"/>
  </g>
  <text x="640" y="262" font-size="17" fill="#5c5878" text-anchor="middle">The Listening indicator follows your voice</text>
  <line x1="838" y1="150" x2="882" y2="150" stroke="#5c5878" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 3. Text appears -->
  <rect x="890" y="10" width="380" height="280" rx="20" fill="#ffffff" stroke="#e2dfef" stroke-width="2"/>
  <text x="920" y="56" font-size="15" font-weight="700" fill="#fc5e53" letter-spacing="2">STEP 3</text>
  <text x="920" y="88" font-size="26" font-weight="600" fill="#20027f">Words appear as you talk</text>
  <rect x="920" y="124" width="320" height="104" rx="10" fill="#f8f7fc" stroke="#e2dfef" stroke-width="2"/>
  <text x="940" y="164" font-size="20" fill="#20027f">Hi team, the build is green</text>
  <text x="940" y="196" font-size="20" fill="#20027f">and ready for review.</text>
  <rect x="1142" y="178" width="2.5" height="24" fill="#fc5e53"/>
  <text x="1080" y="262" font-size="17" fill="#5c5878" text-anchor="middle">In any app: mail, chat, editor, browser</text>
</svg>
