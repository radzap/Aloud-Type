[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[licenses]
# AGPL-3.0 project: only allow permissive/compatible licences.
allow = ["AGPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "Unlicense"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
