name: ci

# Runs only when the app itself changes: its source (crates/), its assets (assets/), or the
# workspace manifests / build settings that decide how the source compiles.
on:
  push:
    paths:
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
  pull_request:
    paths:
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python -I -m unittest discover -s scripts/tests
      - run: python -I scripts/aloud_release/audit.py .

  # Every successful run on main publishes a release: GPU (Vulkan) build, portable zip and installer.
  release:
    needs: [build-test, deny, packaging]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VULKAN_VERSION: 1.4.363.0
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      ALOUDTYPE_TARGET_DIR: C:\atb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the next version number
      - uses: dtolnay/rust-toolchain@stable

      - name: Next version
        id: version
        shell: pwsh
        run: |
          $v = python -I scripts/aloud_release/version.py .
          if ($LASTEXITCODE) { exit 1 }
          if (git tag --list "v$v") { throw "tag v$v already exists" }
          # Cargo.lock records the workspace members' versions; refresh only those.
          cargo update --workspace
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $v"

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $exe --accept-licenses --default-answer --confirm-command install | Out-Host
          if (-not (Test-Path "C:\VulkanSDK\$env:VULKAN_VERSION\Bin\glslc.exe")) { throw "Vulkan SDK install failed" }
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" >> $env:GITHUB_PATH

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build release (GPU + zip + installer)
        run: python -I scripts/release.py --require-gpu --require-installer

      - name: Checksums
        shell: pwsh
        working-directory: dist
        run: |
          Get-ChildItem AloudType-*-portable.zip, AloudType-*-setup.exe |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" --target $env:GITHUB_SHA --title "Aloud Type $env:VERSION" --generate-notes `
            "dist/AloudType-$env:VERSION-portable.zip" "dist/AloudType-$env:VERSION-setup.exe" dist/SHA256SUMS.txt
