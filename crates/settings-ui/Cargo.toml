[package]
name = "aloud-type-settings-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aloud-type-config = { path = "../config" }
aloud-type-core.workspace = true
aloud-type-models = { path = "../models" }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
aloud-type-platform-windows = { path = "../platform-windows" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "thread-pool"] }

[dev-dependencies]
tempfile = "3"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "thread-pool"] }

[build-dependencies]
embed-resource = "3.0.12"
