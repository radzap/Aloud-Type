[package]
name = "aloud-type-app"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[lib]
name = "aloud_type_app"

[[bin]]
name = "aloud-type"
path = "src/main.rs"

[dependencies]
aloud-type-core.workspace = true
aloud-type-config = { path = "../config" }

[target.'cfg(windows)'.dependencies]
aloud-type-platform-windows = { path = "../platform-windows" }
aloud-type-recognizer = { path = "../recognizer" }
aloud-type-models = { path = "../models" }

[dev-dependencies]
aloud-type-recognizer = { path = "../recognizer" }
