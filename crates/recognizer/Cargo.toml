[package]
name = "aloud-type-recognizer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aloud-type-core.workspace = true
whisper-rs = "=0.16.0"
num_cpus = "1"
aloud-type-config = { path = "../config" }

[features]
# Vulkan GPU backend (needs the Vulkan SDK to build). Off by default: CPU-only build.
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
sha2 = "0.10"
